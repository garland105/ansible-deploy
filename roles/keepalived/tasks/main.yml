# ============================================================
# roles/keepalived/tasks/main.yml
# Keepalived - PG VIP 高可用
# 自动检测主网卡，通过 VRRP 实现 VIP 漂移
# ============================================================

- name: "安装 Keepalived"
  apt:
    name: keepalived
    state: present

- name: "自动检测主网卡（默认路由）"
  shell: "ip route | grep '^default' | grep -oP 'dev \\K\\S+'"
  register: detected_interface
  changed_when: false
  failed_when: false

- name: "设置网卡变量"
  set_fact:
    keepalived_interface: "{{ detected_interface.stdout if detected_interface.stdout != '' else 'eth0' }}"

- name: "清理可能残留的旧 VIP（防干扰）"
  shell: "ip addr del {{ pg_vip }}/{{ pg_vip_prefix }} dev {{ keepalived_interface }} 2>/dev/null; ip addr del {{ pg_vip }}/{{ pg_vip_prefix }} dev lo 2>/dev/null; true"
  changed_when: false

- name: "创建健康检查脚本（检测 PG 是否存活）"
  copy:
    dest: /etc/keepalived/check_pg.sh
    content: |
      #!/bin/bash
      # 仅当本机 PG 可连、且处于主库（非 recovery）状态时返回 0
      # 只读备库同样能建立连接，必须判断 recovery 状态，否则备库也会持有 VIP
      OUT=$(PGPASSWORD={{ pg_admin_password }} psql -h 127.0.0.1 -U admin -d postgres \
            -tAc "SELECT NOT pg_is_in_recovery()" 2>/dev/null)
      [ "$OUT" = "t" ]
    mode: "0755"
  notify: restart keepalived

- name: "配置 Keepalived（Leader 优先）"
  copy:
    dest: /etc/keepalived/keepalived.conf
    content: |
      global_defs {
          router_id PG_{{ 'MASTER' if patroni_role == 'leader' else 'BACKUP' }}
          enable_script_security
          script_user root
      }

      vrrp_script chk_pg {
          script "/etc/keepalived/check_pg.sh"
          interval 3
          timeout 3
          fall 2
          rise 2
          # 负权重：检查失败时只扣优先级，不进入 FAULT
          # 若保持默认 weight 0，备库会因「非主库」被判 FAULT，主库宕机时无法接管 VIP
          weight -60
      }

      vrrp_instance VI_PG {
          state {{ 'MASTER' if patroni_role == 'leader' else 'BACKUP' }}
          interface {{ keepalived_interface }}
          virtual_router_id {{ keepalived_vrrp_id | default(52) }}
          priority {{ 150 if patroni_role == 'leader' else 100 }}
          advert_int 1
          authentication {
              auth_type PASS
              auth_pass {{ keepalived_vrrp_pass | default('pg_ha_vip') }}
          }
          virtual_ipaddress {
              {{ pg_vip }}/{{ pg_vip_prefix }} dev {{ keepalived_interface }}
          }
          track_script {
              chk_pg
          }
      }
  notify: restart keepalived

- name: "应用变更（立即执行 restart handler）"
  meta: flush_handlers

- name: "确保 Keepalived 已启动并开机自启"
  systemd:
    name: keepalived
    state: started
    enabled: yes

- name: "轮询确认 VIP 已绑定到本地网卡（仅初始 Leader 校验）"
  shell: "ip -4 -o addr show dev {{ keepalived_interface }} | grep -q '{{ pg_vip }}/'"
  register: vip_check
  until: vip_check.rc == 0
  retries: 15
  delay: 1
  changed_when: false
  failed_when: false
  when: patroni_role == 'leader'
